<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>缘梦 YuanMoon · 分享卡</title>
  <desc>深空底、一轮圆月、左侧站点名。由 assets/img/og-card.svg 渲染为 og-card.png。</desc>

  <defs>
    <style>
      /* 站内自托管的衬线体，让英文和首页保持同一张脸 */
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("../fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("../fonts/cormorant-garamond-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      .en { font-family: "Cormorant Garamond", "Times New Roman", serif; }
      .cn { font-family: "Songti SC", "PingFang SC", "Microsoft YaHei", "SimSun", serif; }
      .mono { font-family: "Consolas", "SFMono-Regular", monospace; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="55%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#f2c879" stop-opacity="0.30"/>
      <stop offset="72%" stop-color="#f2c879" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f2c879" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonLit" cx="36%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="55%" stop-color="#f7ecd4"/>
      <stop offset="100%" stop-color="#d6b986"/>
    </radialGradient>

    <radialGradient id="leftFade" cx="0%" cy="50%" r="78%">
      <stop offset="0%" stop-color="#04060d" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#04060d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 星点：手写一批，位置固定，保证每次渲染的图完全一致 -->
  <g fill="#e8edf7">
    <circle cx="86" cy="92" r="1.6" opacity="0.55"/>
    <circle cx="188" cy="196" r="1.1" opacity="0.35"/>
    <circle cx="142" cy="352" r="1.4" opacity="0.45"/>
    <circle cx="238" cy="520" r="1.2" opacity="0.3"/>
    <circle cx="330" cy="140" r="1.5" opacity="0.4"/>
    <circle cx="392" cy="452" r="1.1" opacity="0.35"/>
    <circle cx="470" cy="88" r="1.3" opacity="0.3"/>
    <circle cx="524" cy="560" r="1.6" opacity="0.42"/>
    <circle cx="612" cy="212" r="1.2" opacity="0.3"/>
    <circle cx="668" cy="418" r="1.4" opacity="0.38"/>
    <circle cx="742" cy="96" r="1.5" opacity="0.45"/>
    <circle cx="806" cy="548" r="1.2" opacity="0.3"/>
    <circle cx="1042" cy="132" r="1.6" opacity="0.5"/>
    <circle cx="1108" cy="288" r="1.2" opacity="0.32"/>
    <circle cx="988" cy="512" r="1.4" opacity="0.4"/>
    <circle cx="1146" cy="466" r="1.1" opacity="0.3"/>
    <circle cx="72" cy="248" r="1.2" opacity="0.3"/>
    <circle cx="296" cy="596" r="1.3" opacity="0.32"/>
  </g>

  <!-- 圆月 -->
  <circle cx="884" cy="315" r="330" fill="url(#moonHalo)"/>
  <circle cx="884" cy="315" r="196" fill="url(#moonLit)"/>
  <circle cx="884" cy="315" r="196" fill="none" stroke="#f2c879" stroke-width="1.2" opacity="0.5"/>
  <!-- 一条极淡的轨道虚线，交代"月亮在走" -->
  <circle cx="884" cy="315" r="258" fill="none" stroke="#c3cadb" stroke-width="1"
          stroke-dasharray="1 16" opacity="0.22"/>

  <!-- 左侧压一层暗，保证中文在任何底色上都读得清 -->
  <rect width="760" height="630" fill="url(#leftFade)"/>

  <g transform="translate(104 0)">
    <!-- 小月标 -->
    <g transform="translate(0 138)">
      <circle cx="19" cy="19" r="18" fill="none" stroke="#f2c879" stroke-width="1.4" opacity="0.6"/>
      <path d="M19 1 A18 18 0 0 1 19 37 A10.8 18 0 0 1 19 1 Z" fill="#fbeccc"/>
    </g>

    <text class="mono" x="0" y="196" font-size="19" letter-spacing="6.2" fill="#8e9ab4">YUANMOON · 缘梦</text>

    <text class="cn" x="-6" y="330" font-size="118" font-weight="700" fill="#f7f3ea" letter-spacing="6">缘梦</text>

    <text class="en" x="0" y="404" font-size="52" font-weight="600" letter-spacing="3" fill="#f2c879">YuanMoon</text>

    <line x1="2" y1="444" x2="150" y2="444" stroke="#f2c879" stroke-width="1.4" opacity="0.55"/>

    <text class="cn" x="0" y="494" font-size="29" fill="#c3cadb" letter-spacing="4">起点与圆满</text>

    <text class="cn" x="0" y="546" font-size="21" fill="#7d8aa5" letter-spacing="1.4">小游戏 · 时空模拟 · 独立开发</text>
  </g>
</svg>
