<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月相挑战 · 缘梦 YuanMoon</title>
<meta name="description" content="把月亮调成题目要的月相。十道题，顺带认全朔望月的八个阶段。">
<meta name="theme-color" content="#04060d">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://yuanmoon.me/games/moon-phase/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="缘梦 YuanMoon">
<meta property="og:title" content="月相挑战 · 缘梦 YuanMoon">
<meta property="og:description" content="把月亮调成题目要的月相，顺带认全朔望月的八个阶段。">
<meta property="og:url" content="https://yuanmoon.me/games/moon-phase/">
<meta property="og:locale" content="zh_CN">
<meta property="og:image" content="https://yuanmoon.me/assets/img/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/components.css">
<link rel="stylesheet" href="game.css">

<!-- 和首页同样的处理：脚本挂了也不留空白 -->
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<a class="skip-link" href="#play">跳到游戏</a>

<div class="starfield" aria-hidden="true">
  <div class="starfield__glow"></div>
  <svg class="starfield__svg" id="starfield" preserveAspectRatio="none"></svg>
</div>
<div class="grain" aria-hidden="true"></div>

<header class="game-bar">
  <a class="game-bar__back" href="../../index.html">
    <span aria-hidden="true">←</span> 缘梦
  </a>
  <p class="eyebrow">小游戏 01 · 月相</p>
  <p class="game-bar__round" id="roundLabel">第 <b>1</b> / 10 轮</p>
</header>

<main class="game" id="play">

  <!-- ================= 左：观测台 ================= -->
  <div class="observatory">
    <div class="moon-stage">
      <svg class="moon" viewBox="0 0 400 400" role="img" aria-labelledby="moonTitle moonDesc">
        <title id="moonTitle">当前月相</title>
        <desc id="moonDesc">可以调节的月亮</desc>
        <defs>
          <radialGradient id="moonHaloGradient">
            <stop offset="58%" stop-color="#f2c879" stop-opacity="0"/>
            <stop offset="78%" stop-color="#f2c879" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#f2c879" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="moonLit" cx="36%" cy="32%" r="76%">
            <stop offset="0%" stop-color="#fffdf7"/>
            <stop offset="55%" stop-color="#f7ecd4"/>
            <stop offset="100%" stop-color="#d6b986"/>
          </radialGradient>
          <radialGradient id="moonDark" cx="36%" cy="30%" r="82%">
            <stop offset="0%" stop-color="#1e2740"/>
            <stop offset="70%" stop-color="#131a2c"/>
            <stop offset="100%" stop-color="#0c1120"/>
          </radialGradient>
        </defs>

        <circle class="moon__halo" id="moonHalo" cx="200" cy="200" r="198" fill="url(#moonHaloGradient)"/>
        <circle class="moon__earthshine" cx="200" cy="200" r="140" fill="url(#moonDark)"/>
        <path class="moon__lit" id="moonLitPath" d=""/>
        <circle cx="200" cy="200" r="140" fill="none" stroke="#f2c879" stroke-width="1" opacity="0.45"/>
        <!-- 自转刻度：让月亮的方位可读，也给画面一点仪器的感觉 -->
        <circle cx="200" cy="200" r="176" fill="none" stroke="rgba(195,202,219,.14)"
                stroke-width="1" stroke-dasharray="1 14"/>
      </svg>
    </div>

    <!-- 挑战模式下这里是问号，自由模式下实时报读 -->
    <p class="readout" id="readout" aria-live="polite">
      <span class="readout__name" id="readoutName">？</span>
      <span class="readout__meta" id="readoutMeta">拖动滑块改变月相</span>
    </p>
  </div>

  <!-- ================= 右：控制台 ================= -->
  <div class="console">

    <div class="task" id="taskBlock">
      <p class="eyebrow">把月亮调成</p>
      <h1 class="task__target" id="taskTarget">上弦月</h1>
      <p class="task__hint">拖滑块，或者按 <kbd>←</kbd> <kbd>→</kbd> 微调</p>
    </div>

    <div class="slider-wrap">
      <input class="slider" id="slider" type="range" min="0" max="1000" value="0" step="1"
             aria-label="月相"
             aria-valuetext="新月">
      <div class="slider-scale" aria-hidden="true">
        <span>朔</span>
        <span>望</span>
        <span>朔</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn--primary" id="submitBtn" type="button">确认</button>
      <button class="btn btn--ghost" id="modeBtn" type="button">自由玩</button>
    </div>

    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

    <dl class="scoreboard">
      <div>
        <dt>这一轮</dt>
        <dd id="lastScore">—</dd>
      </div>
      <div>
        <dt>总分</dt>
        <dd id="totalScore">0</dd>
      </div>
      <div>
        <dt>最好单轮</dt>
        <dd id="bestScore">—</dd>
      </div>
    </dl>

  </div>
</main>

<footer class="game-foot">
  <p>朔望月约 29.53 天。月亮绕地球一圈，被照亮的半边始终朝太阳 —— 我们看到的形状，取决于它站在哪儿。</p>
  <p><a href="../../index.html">← 回缘梦</a></p>
</footer>

<script src="../../scripts/main.js" defer></script>
<script src="moon.js" defer></script>
</body>
</html>
